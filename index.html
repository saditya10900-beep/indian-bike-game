
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Bike Racing</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101522;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow:hidden;touch-action:none
}
header{
 padding:10px;background:#17243b;
 display:flex;justify-content:space-around;
 align-items:center;flex-wrap:wrap
}
h2{margin:5px;color:#ffca28}
.stat{font-size:14px;font-weight:bold}
canvas{
 display:block;margin:auto;
 background:#65ad54;width:100%;
 max-width:550px;height:calc(100dvh - 175px);
}
.controls{
 display:flex;justify-content:center;gap:35px;
 padding:12px;background:#17243b;
}
button{
 border:0;border-radius:12px;padding:13px 25px;
 background:#ff9800;color:white;font-size:19px;
 font-weight:bold;cursor:pointer;touch-action:none
}
button:active{background:#e65100}
#overlay{
 position:fixed;inset:0;background:#000b;
 display:flex;align-items:center;justify-content:center;
 z-index:5
}
.panel{
 background:#17243b;padding:25px;
 border-radius:18px;width:85%;max-width:350px
}
.panel button{margin-top:15px}
.small{font-size:12px;color:#ddd}
</style>
</head>
<body>

<header>
 <h2>🏍️ INDIAN BIKE RACING</h2>
 <div class="stat">SCORE: <span id="score">0</span></div>
 <div class="stat">SPEED: <span id="speed">0</span></div>
 <div class="stat">BEST: <span id="best">0</span></div>
</header>

<canvas id="game"></canvas>

<div class="controls">
 <button id="left">⬅ LEFT</button>
 <button id="right">RIGHT ➡</button>
</div>

<div id="overlay">
 <div class="panel">
  <h1>🏍️ BIKE RACING</h1>
  <p>भारतीय हाईवे पर रेसिंग का मजा लो!</p>
  <p>⬅ ➡ बटन से बाइक चलाओ</p>
  <button id="start">START GAME</button>
  <p class="small">ट्रैफिक से बचें और ज्यादा स्कोर बनाएं।</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=400,H=600;
function resize(){
 const r=canvas.getBoundingClientRect();
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(r.width*d);
 canvas.height=Math.floor(r.height*d);
 W=canvas.width;H=canvas.height;
}
resize();
window.addEventListener("resize",resize);

let running=false;
let score=0,speed=0;
let roadOffset=0;
let playerX=0;
let targetX=0;
let enemies=[];
let spawn=0;
let last=0;
let best=Number(localStorage.getItem("bikeBest")||0);

document.getElementById("best").textContent=best;

function road(){
 const cx=W/2;
 const roadW=W*.65;
 ctx.fillStyle="#559b48";
 ctx.fillRect(0,0,W,H);

 // roadside decorations
 for(let y=-40;y<H+50;y+=100){
  let yy=(y+roadOffset)%100;
  ctx.fillStyle="#347c35";
  ctx.beginPath();
  ctx.arc(W*.12,yy,12,0,Math.PI*2);
  ctx.arc(W*.88,yy+30,15,0,Math.PI*2);
  ctx.fill();
 }

 // road
 ctx.fillStyle="#40434b";
 ctx.fillRect(cx-roadW/2,0,roadW,H);

 // road edges
 ctx.fillStyle="white";
 ctx.fillRect(cx-roadW/2,0,5,H);
 ctx.fillRect(cx+roadW/2-5,0,5,H);

 // dashed lines
 ctx.fillStyle="#fff";
 for(let y=-70;y<H+70;y+=100){
  let yy=(y+roadOffset)%100;
  ctx.fillRect(cx-roadW/6-3,yy,6,45);
  ctx.fillRect(cx+roadW/6-3,yy,6,45);
 }
}

function bike(x,y,color,player=false){
 ctx.save();
 ctx.translate(x,y);

 // wheels
 ctx.fillStyle="#111";
 ctx.fillRect(-13,15,26,28);
 ctx.fillRect(-12,-32,24,20);

 // body
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(-15,12);
 ctx.lineTo(-12,-20);
 ctx.lineTo(0,-31);
 ctx.lineTo(12,-20);
 ctx.lineTo(15,12);
 ctx.closePath();
 ctx.fill();

 // seat
 ctx.fillStyle="#222";
 ctx.fillRect(-10,-8,20,18);

 // headlight
 ctx.fillStyle="#ffe66b";
 ctx.fillRect(-5,-27,10,6);

 // rider helmet
 ctx.fillStyle=player?"#f44336":"#222";
 ctx.beginPath();
 ctx.arc(0,-40,10,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function enemyCar(x,y,color){
 ctx.fillStyle=color;
 ctx.fillRect(x-19,y-28,38,56);
 ctx.fillStyle="#bde7ff";
 ctx.fillRect(x-13,y-19,26,14);
 ctx.fillRect(x-13,y+5,26,12);
 ctx.fillStyle="#111";
 ctx.fillRect(x-22,y-20,5,13);
 ctx.fillRect(x+17,y-20,5,13);
 ctx.fillRect(x-22,y+13,5,13);
 ctx.fillRect(x+17,y+13,5,13);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 road();

 // traffic
 enemies.forEach(e=>{
  if(e.type==="car") enemyCar(e.x,e.y,e.color);
  else bike(e.x,e.y,e.color);
 });

 // player
 bike(W/2+playerX,H*.79,"#ff9800",true);
}

function reset(){
 score=0;speed=0;
 playerX=0;targetX=0;
 enemies=[];spawn=0;
 roadOffset=0;
}

function gameOver(){
 running=false;
 if(score>best){
  best=score;
  localStorage.setItem("bikeBest",best);
 }
 document.getElementById("best").textContent=best;
 document.getElementById("overlay").style.display="flex";
 document.querySelector(".panel h1").textContent="🏁 GAME OVER";
 document.querySelector(".panel p").textContent=
 "आपका स्कोर: "+score;
 document.getElementById("start").textContent="PLAY AGAIN";
}

function update(dt){
 if(!running)return;

 speed=Math.min(180,80+score*.15);
 roadOffset=(roadOffset+speed*dt*.35)%100;

 playerX+=(targetX-playerX)*Math.min(1,dt*8);

 let maxX=W*.23;
 playerX=Math.max(-maxX,Math.min(maxX,playerX));

 spawn+=dt;
 if(spawn>Math.max(.55,1.25-score*.001)){
  spawn=0;
  let lane=Math.floor(Math.random()*3)-1;
  enemies.push({
   x:W/2+lane*W*.20,
   y:-60,
   color:["#2196f3","#e91e63","#4caf50","#f5b400"][Math.floor(Math.random()*4)],
   type:Math.random()>.5?"car":"bike"
  });
 }

 enemies.forEach(e=>{
  e.y+=speed*dt*.55;

  let px=W/2+playerX;
  let py=H*.79;

  if(Math.abs(e.x-px)<29 && Math.abs(e.y-py)<45){
   gameOver();
  }
 });

 enemies=enemies.filter(e=>e.y<H+80);

 score+=Math.floor(dt*10);
 document.getElementById("score").textContent=score;
 document.getElementById("speed").textContent=Math.floor(speed)+" km/h";
}

function loop(time){
 let dt=Math.min((time-last)/1000,.04);
 last=time;
 if(running)update(dt);
 draw();
 requestAnimationFrame(loop);
}

document.getElementById("start").onclick=()=>{
 reset();
 running=true;
 document.getElementById("overlay").style.display="none";
 document.querySelector(".panel h1").textContent="🏍️ BIKE RACING";
};

function move(direction){
 if(!running)return;
 targetX+=direction*W*.20;
 targetX=Math.max(-W*.23,Math.min(W*.23,targetX));
}

document.getElementById("left").addEventListener("pointerdown",e=>{
 e.preventDefault();move(-1);
});
document.getElementById("right").addEventListener("pointerdown",e=>{
 e.preventDefault();move(1);
});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
});

requestAnimationFrame(loop);
</script>
</body>
</html>
